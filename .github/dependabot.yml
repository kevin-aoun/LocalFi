version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: tailwind-merge
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /.github/workflows
    schedule:
      interval: monthly
