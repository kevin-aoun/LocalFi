services:
  data-permissions:
    image: alpine:3.22
    user: "0:0"
    environment:
      - LOCALFI_DATA_UID=${DOCKER_UID:-1000}
      - LOCALFI_DATA_GID=${DOCKER_GID:-1000}
    volumes:
      - ./data:/app/data
    command:
      - sh
      - -euc
      - |
        case "$$LOCALFI_DATA_UID:$$LOCALFI_DATA_GID" in
          *[!0-9:]*|:*|*:|*:*:*) echo "Invalid DOCKER_UID/DOCKER_GID" >&2; exit 1 ;;
        esac
        requires_bootstrap=1
        bootstrap_file=/app/data/.localfi-bootstrap-token
        setup_url=
        if [ -L /app/data/budget.db ]; then
          echo "Refusing data preflight: budget.db must not be a symbolic link." >&2
          exit 1
        elif [ -e /app/data/budget.db ] && [ ! -f /app/data/budget.db ]; then
          echo "Refusing data preflight: budget.db must be a regular file." >&2
          exit 1
        elif [ -f /app/data/budget.db ]; then
          budget_links="$$(stat -c %h /app/data/budget.db 2>/dev/null)" || budget_links=invalid
          if [ "$$budget_links" != 1 ]; then
            echo "Refusing data preflight: budget.db must have exactly one hard link." >&2
            exit 1
          fi
          vault_magic="$$(od -An -tx1 -N8 /app/data/budget.db 2>/dev/null | tr -d ' \n')"
          if [ "$$vault_magic" = "4c465641554c5400" ]; then requires_bootstrap=0; fi
        fi
        if [ "$$requires_bootstrap" -eq 1 ]; then
          if [ -L "$$bootstrap_file" ] || { [ -e "$$bootstrap_file" ] && [ ! -f "$$bootstrap_file" ]; }; then
            echo "Refusing unsafe bootstrap credential path." >&2
            exit 1
          fi
          token="$$(od -An -tx1 -N32 /dev/urandom | tr -d ' \n')"
          token_temp="$$(mktemp /app/data/.localfi-bootstrap-token.XXXXXX)"
          chmod 0600 "$$token_temp"
          printf '%s\n' "$$token" > "$$token_temp"
          mv -f "$$token_temp" "$$bootstrap_file"
          setup_url="http://localhost:1313/vault#setup=$$token"
        else
          rm -f "$$bootstrap_file"
        fi
        hardlink_marker=/tmp/localfi-hardlink-refused
        rm -f "$$hardlink_marker"
        find /app/data -xdev -type f -exec sh -euc '
          marker=$$1
          shift
          for file do
            links=$$(stat -c %h "$$file" 2>/dev/null) || links=invalid
            if [ "$$links" != 1 ]; then
              : > "$$marker"
              break
            fi
          done
        ' sh "$$hardlink_marker" {} +
        if [ -e "$$hardlink_marker" ]; then
          echo "Refusing data preflight: every regular file must have exactly one hard link." >&2
          exit 1
        fi
        find /app/data -xdev -type d -exec chown "$$LOCALFI_DATA_UID:$$LOCALFI_DATA_GID" {} \;
        find /app/data -xdev -type d -exec chmod 0700 {} \;
        find /app/data -xdev -type f -exec chown "$$LOCALFI_DATA_UID:$$LOCALFI_DATA_GID" {} \;
        find /app/data -xdev -type f -exec chmod 0600 {} \;
        if [ -n "$$setup_url" ]; then
          echo
          echo "LocalFi first-run setup"
          echo "Open this one-time link after the app is ready:"
          echo "$$setup_url"
          echo
        fi
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    depends_on:
      data-permissions:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:1313:1313"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./data/budget.db
      - NEXT_PUBLIC_APP_URL=http://localhost:1313
      - SNAPSHOT_API_TOKEN=${SNAPSHOT_API_TOKEN:-}
      - LOCALFI_VAULT_BOOTSTRAP_TOKEN_FILE=/app/data/.localfi-bootstrap-token
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:1313/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  snapshot:
    profiles: [scheduler]
    image: alpine:latest
    depends_on:
      app:
        condition: service_healthy
    environment:
      - SNAPSHOT_API_TOKEN=${SNAPSHOT_API_TOKEN:-}
      - SNAPSHOT_INTERVAL_HOURS=${SNAPSHOT_INTERVAL_HOURS:-6}
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl >/dev/null 2>&1
        if [ -z "$$SNAPSHOT_API_TOKEN" ]; then
          echo "snapshot: SNAPSHOT_API_TOKEN is unset; refusing to run (the endpoint would 503 anyway)."
          exit 1
        fi
        echo "snapshot: recording every $$SNAPSHOT_INTERVAL_HOURS h (idempotent per day)"
        while true; do
          RESP=$$(curl -s --max-time 30 -X POST http://app:1313/api/snapshot \
                    -H "Authorization: Bearer $$SNAPSHOT_API_TOKEN" \
                    -H 'Content-Type: application/json' 2>&1)
          echo "$$(date -u '+%Y-%m-%dT%H:%M:%SZ') $$RESP"
          sleep $$(( $$SNAPSHOT_INTERVAL_HOURS * 3600 ))
        done
    restart: unless-stopped
