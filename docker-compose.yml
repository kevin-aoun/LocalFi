services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    ports:
      - "127.0.0.1:1313:1313"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./data/budget.db
      - NEXT_PUBLIC_APP_URL=http://localhost:1313
      - NEEDLE_URL=http://needle:8765
      - AGENT_API_TOKEN=${AGENT_API_TOKEN:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:1313/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  needle:
    profiles: [ai]
    build:
      context: .
      dockerfile: agent/Dockerfile
    environment:
      - NEEDLE_HOST=0.0.0.0
      - NEEDLE_PORT=8765
      - NEEDLE_PLATFORM=cpu
      - NEEDLE_ALLOW_NON_LOOPBACK=1
      - NEEDLE_CHECKPOINT=${NEEDLE_CHECKPOINT:-}
    volumes:
      - ${NEEDLE_MODELS_DIR:-~/.local/share/cactus-needle/checkpoints}:/opt/needle-src/checkpoints:ro
      - needle-jax-cache:/tmp/jax-cache
    restart: unless-stopped

  snapshot:
    profiles: [scheduler]
    image: alpine:latest
    depends_on:
      app:
        condition: service_healthy
    environment:
      - AGENT_API_TOKEN=${AGENT_API_TOKEN:-}
      - SNAPSHOT_INTERVAL_HOURS=${SNAPSHOT_INTERVAL_HOURS:-6}
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl >/dev/null 2>&1
        if [ -z "$$AGENT_API_TOKEN" ]; then
          echo "snapshot: AGENT_API_TOKEN is unset; refusing to run (the endpoint would 503 anyway)."
          exit 1
        fi
        echo "snapshot: recording every $$SNAPSHOT_INTERVAL_HOURS h (idempotent per day)"
        while true; do
          RESP=$$(curl -s --max-time 30 -X POST http://app:1313/api/snapshot \
                    -H "Authorization: Bearer $$AGENT_API_TOKEN" \
                    -H 'Content-Type: application/json' 2>&1)
          echo "$$(date -u '+%Y-%m-%dT%H:%M:%SZ') $$RESP"
          sleep $$(( $$SNAPSHOT_INTERVAL_HOURS * 3600 ))
        done
    restart: unless-stopped

volumes:
  needle-jax-cache:
    driver: local
